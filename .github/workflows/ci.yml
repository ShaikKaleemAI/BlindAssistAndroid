# Push to GitHub -> this builds an installable APK and publishes it on the repo's "Releases" page.
name: build-apk
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (the runner already has the SDK preinstalled)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build debug APK (downloads the detector model during the build)
        run: gradle :app:assembleDebug --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BlindAssist-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: BlindAssist-debug-apk, path: BlindAssist-debug.apk }
      - name: Publish to Releases (phone-friendly download link)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          files: BlindAssist-debug.apk

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (the runner already has the SDK preinstalled)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Unit tests (no model download needed)
        run: gradle :app:testDebugUnitTest -PskipModel --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-report, path: app/build/reports/tests/ }
